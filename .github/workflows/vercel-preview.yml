name: Deploy preview to Vercel

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull preview configuration
        run: vercel pull --yes --environment=preview

      # The GitHub runner produces .vercel/output. Vercel receives only that
      # prebuilt artifact, so it never builds this repository's source.
      - name: Build preview artifact
        run: vercel build

      - name: Deploy preview artifact
        run: vercel deploy --prebuilt --archive=tgz --yes
